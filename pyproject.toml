[project]
name = "steam-research-mcp"
version = "2.2.0"
description = "Unofficial read-only Steam research MCP server for games, prices, reviews, builds, public players, libraries, achievements, and market analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarg" }, { name = "BK927" }]
maintainers = [{ name = "BK927" }]
keywords = ["mcp", "steam", "steam-api", "model-context-protocol", "ai-agents", "game-data", "game-reviews", "gaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx2>=2.9",
    "pydantic>=2.6.0",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
gcp = [
    "google-cloud-firestore>=2.21,<3",
    "google-cloud-storage>=3.4,<4",
    "google-cloud-tasks>=2.20,<3",
]

[project.scripts]
steam-research-mcp = "steam_mcp.server:main"
# Compatibility alias for existing source checkouts. The PyPI name `steam-mcp`
# belongs to a different upstream project, so public instructions use the
# primary `steam-research-mcp` command.
steam-mcp = "steam_mcp.server:main"

[project.urls]
Homepage = "https://github.com/BK927/steam-research-mcp"
Repository = "https://github.com/BK927/steam-research-mcp"
Issues = "https://github.com/BK927/steam-research-mcp/issues"
Documentation = "https://github.com/BK927/steam-research-mcp#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), bugbear (B), and blind-except (BLE — this is
# the rule the `# noqa: BLE001` markers on the broad tool-level excepts suppress).
select = ["E", "F", "W", "B", "BLE"]
# Line length is a soft ~88 convention here, not a hard CI gate.
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steam_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/steam_mcp",
    "/tests",
    "/README.md",
    "/CHANGES.md",
    "/LICENSE",
    "/PRIVACY.md",
    "/SECURITY.md",
    "/SKILL.md",
    "/pyproject.toml",
]
